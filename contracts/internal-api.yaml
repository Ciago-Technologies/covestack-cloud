# Generated by generate_lifecycle.py; edit lifecycle-rules.json/internal-api.base.json.
"openapi": "3.0.3"
"info":
  "title": "Covestack Cloud — Internal Agent API"
  "version": "1.1.0"
  "description": "Covestack Cloud pull-only signed agent API. Generated from lifecycle-rules.json and internal-api.base.json. Defined kinds do not imply implemented drivers. Agents advertise supportedKinds; work must be filtered to that capability set. Server-owned groups/buckets/operations/metadata never become agent work. Coordinated Anuj/B/C review required for contract changes."
"security":
  -
    "AgentAccessKey": []
    "AgentDate": []
    "AgentNonce": []
    "AgentSignature": []
"servers":
  -
    "url": "http://localhost:4700"
    "description": "kan-server, local dev"
"paths":
  "/internal/v1/agent/heartbeat":
    "post":
      "summary": "Agent says \"I am alive\""
      "operationId": "heartbeat"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "required":
                - "agentVersion"
                - "dockerVersion"
                - "supportedKinds"
              "properties":
                "agentVersion":
                  "type": "string"
                  "example": "1.0.0"
                "dockerVersion":
                  "type": "string"
                  "example": "24.0.7"
                "supportedKinds":
                  "type": "array"
                  "uniqueItems": true
                  "maxItems": 5
                  "items":
                    "$ref": "#/components/schemas/AgentResourceKind"
                  "description": "Advertise only installed, tested drivers. Empty means no resource execution capability; never advertise planned drivers."
      "responses":
        "200":
          "description": "Acknowledged"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "ok":
                    "type": "boolean"
                    "example": true
  "/internal/v1/agent/work":
    "get":
      "summary": "Agent asks \"what do I need to do?\""
      "operationId": "getWork"
      "description": "Only agent-owned resources assigned to this authenticated agent/account and advertised supportedKinds. Exclude server-managed groups/buckets and already-acknowledged terminal resources."
      "responses":
        "200":
          "description": "List of resources needing action"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/AgentResource"
                "maxItems": 1000
  "/internal/v1/agent/resources/{id}/observed":
    "put":
      "summary": "Agent reports what actually exists"
      "operationId": "putObserved"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
          "example": "01J8ZK9XCLUSTER1"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ObservedReport"
      "responses":
        "200":
          "description": "Applied or ignored as stale; future generation must be rejected"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "ok":
                    "type": "boolean"
                  "applied":
                    "type": "boolean"
                "required":
                  - "ok"
                  - "applied"
      "description": "kind must equal the owned stored resource kind. Enforce lifecycle and successful generation acknowledgement; return applied=false for stale reports. LifecycleValidator alone does not enforce account/lease/timestamp ordering."
  "/internal/v1/agent/known-ids":
    "get":
      "summary": "Agent asks \"what should exist right now?\" (used to clean up orphan containers/clusters)"
      "operationId": "getKnownIds"
      "responses":
        "200":
          "description": "All live resource ids for this agent's account"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "type": "string"
                "example":
                  - "01J8ZK9XCLUSTER1"
                  - "01J8ZK9XINSTANCE2"
      "description": "Complete account/agent-scoped IDs for agent-owned supported kinds only. Groups and server-managed buckets are excluded. Partial/time-out results never authorize cleanup; do not silently truncate."
  "/internal/v1/agent/events":
    "post":
      "summary": "Agent reports something happened (e.g. \"container died\")"
      "operationId": "postEvent"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AgentEvent"
      "responses":
        "200":
          "description": "Event accepted for audit; events do not directly mutate resource state."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "ok":
                    "type": "boolean"
                    "example": true
