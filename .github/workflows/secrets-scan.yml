# .github/workflows/secrets-scan.yml
name: Secrets Scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install and Run Gitleaks CLI
        run: |
          set -euo pipefail
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          archive=gitleaks_8.21.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_8.21.2_checksums.txt" --output checksums.txt
          awk -v file="$archive" '$2 == file {print}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar xf "$archive" gitleaks
          ./gitleaks detect --source .
