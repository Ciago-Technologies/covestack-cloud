services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set an exact tested Postgres 17 image tag or digest}
    environment:
      POSTGRES_DB: kan
      POSTGRES_USER: kan
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]

  valkey:
    image: ${VALKEY_IMAGE:?Set an exact tested Valkey 8 image tag or digest}
    command: ["valkey-server", "/run/secrets/valkey_config"]
    secrets: [valkey_config]
    ports: ["127.0.0.1:6390:6379"]
    volumes: [valkeydata:/data]
    networks: [backend]

  mailpit:
    image: ${MAILPIT_IMAGE:?Set an exact tested Mailpit image tag or digest}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [backend]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  valkey_config:
    file: ./secrets/valkey.conf
networks:
  backend: {}
volumes:
  pgdata: {}
  valkeydata: {}
